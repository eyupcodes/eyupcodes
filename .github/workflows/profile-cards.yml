name: Generate Profile Cards

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  profile-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Generate self-hosted profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: eyupcodes
          cards: overview,lifetime,contributions,rhythm,languages
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: "chore(profile): refresh generated cards [skip ci]"
